<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>בדיקות התוסף</title>
<style>
body{font-family:system-ui;margin:24px;background:#f6f9fc}
h1{font-size:20px} .ok{color:#3d7a4e} .fail{color:#b03030;font-weight:700}
li{margin:4px 0;font-size:14px} #sum{font-size:16px;font-weight:700;margin:12px 0}
</style></head><body>
<h1>🧪 בדיקות רגרסיה — נפתח ידנית, רץ על הקבצים האמיתיים</h1>
<p>כל בדיקה כאן נולדה מתקלה אמיתית שקרתה. אם אחת נשברת — התיקון שלה נסוג.</p>
<div id="sum">טוען…</div><ul id="out"></ul>
<script>
// ⚠ AUDIT (קטנות): הדפוס "הגנה כמעט בכל מקום" חזר שלוש פעמים בשבוע אחד.
// הקובץ הזה אוסף את בדיקות הדפדפן שהוכיחו את התיקונים, כדי שרגרסיה תצעק.
// פתיחה: מתוך chrome://extensions -> פרטים -> tests.html, או דרך שרת מקומי.
const results=[];
const t=(name,fn)=>{try{const v=fn();results.push({name,ok:v===true,info:v===true?'':String(v)})}
  catch(e){results.push({name,ok:false,info:e.message})}};
const get=async f=>await (await fetch(f+'?v='+Date.now(),{cache:'no-store'})).text();
(async()=>{
const bg=await get('background.js'), lc=await get('leumi-content.js'), btb=await get('btb-content.js');
const dash=await get('dashboard.js'), dashHtml=await get('dashboard.html'), ch=await get('card-history.js'), ocr=await get('cheque-ocr.js'), led=await get('cheque-ledger.js');

// ── פרסינג: כל הקבצים נטענים ──
for(const [f,txt] of [['background.js',bg],['leumi-content.js',lc],['btb-content.js',btb],
    ['dashboard.js',await get('dashboard.js')],['discount-content.js',await get('discount-content.js')],
    ['fibi-content.js',await get('fibi-content.js')],['cheque-store.js',await get('cheque-store.js')],['cheque-ocr.js',ocr],['cheque-ledger.js',led],['yahav.js',await get('yahav.js')],['card-history.js',ch]])
  t('פרסינג: '+f,()=>{new Function(txt);return true});

// ── 1.33.4: תאריך דבוק לסכום (btb) ──
t('BTB: תאריך דבוק ₪3,155.1517.09.2026 נקרא',()=>{
  const DATE=eval(btb.match(/const DATE=(\/[^\n]*?\/);/)[1]);
  const m='תשלום הבא₪3,155.1517.09.2026'.match(DATE);
  return m&&m[0]==='17.09.2026'||'קיבל: '+(m&&m[0])});

// ── 1.46.0: משפחת שגיאות ה-bfcache ──
t('BFCACHE: תופס את שלוש המחרוזות ולא את הרגילות',()=>{
  const BF=eval(bg.match(/const BFCACHE=(\/.*?\/i);/)[1]);
  const hit=['moved into back/forward cache, so the message channel is closed',
    'message channel closed before a response was received','Extension context invalidated.'];
  const miss=['הפסיק להגיב — 45 שניות','רשת התנועות לא נטענה','לא השיב תוך 300 שניות'];
  return hit.every(x=>BF.test(x))&&miss.every(x=>!BF.test(x))||'כשל בסיווג'});

// ── 1.48.1: זיהוי "אין מאזין" בדיסקונט ──
t('דיסקונט: NO_RECEIVER מזהה את המרוץ בלבד',()=>{
  const NR=eval(bg.match(/const NO_RECEIVER=(\/.*?\/i);/)[1]);
  return NR.test('Could not establish connection. Receiving end does not exist.')
    &&!NR.test('back/forward cache')||'סיווג שגוי'});

// ── 1.45.1: שיק שהתחזה לחשבון ──
t('לאומי: שורת שיק נדחית מהזיהוי, חשבונות אמיתיים עוברים',()=>{
  const TX=eval(lc.match(/const TX_WORDS=(\/.*?\/);/)[1]);
  const n=v=>String(v||'').replace(/\s+/g,' ').trim();
  const looks=v=>TX.test(n(v))||n(v).length>120;
  return looks("הפקדת שיק .2026 | תאריך ערך: .2026 טל 7 / 7 אסמכתא 73416 מס' שיק 80000766 ערוץ הפקדה אפליקציית לאומי חשבון משלם 11- ייצוא הדפסה 153-54074")
    &&!looks('דפנה מלכה- מלכה משק חקלאי מניב לאומי 985-18400/26')||'סיווג שגוי'});

// ── 1.42.0: יתרה מצטברת מתא מאוחד, ושורה עתידית נשארת עתידית ──
t('לאומי: תא מאוחד נקרא לפי תווית; עתידית לא מקבלת יתרה',()=>{
  const money=v=>{const s=String(v||'').replace(/[−–]/g,'-');if(!/\d/.test(s))return null;
    const neg=s.includes('-'),n=Number(s.replace(/[,₪\s-]/g,'').replace(/[^0-9.]/g,''));
    return Number.isFinite(n)?(neg?-n:n):null};
  const MC=eval(lc.match(/const MERGED_CELL=(\/.*?\/);/)[1]);
  const RB=c=>{const m=String(c||'').match(/יתרה\s*מצטברת\s*₪?\s*(-?[\d,]+\.\d{2})/);return m?money(m[1]):null};
  const read=c=>MC.test(String(c||''))?RB(c):money(c);
  return read('סכום ₪ 3,540.00 יתרה מצטברת ₪ 44,079.56')===44079.56
    &&read('סכום ₪ -100.00')===null&&read('₪ 44,079.56')===44079.56||'קריאה שגויה'});

// ── 1.49.0: המנעול לא מאבד עדכונים ──
await (async()=>{
  const store={a:1,b:1};
  const mutex=(()=>{let q=Promise.resolve();return fn=>{const r=q.then(fn,fn);q=r.then(()=>{},()=>{});return r}})();
  const d=ms=>new Promise(r=>setTimeout(r,ms));
  const w=(k,ms)=>mutex(async()=>{const v=store[k];await d(ms);store[k]=v+1});
  await Promise.all([w('a',20),w('b',4),w('a',8)]);
  results.push({name:'accountsMutex: שלושה כותבים חופפים — אפס אובדן',ok:store.a===3&&store.b===2,
    info:store.a===3&&store.b===2?'':JSON.stringify(store)});
})();

// ── 1.49.0: שער השפיות ──
t('שער שפיות: שלושת התנאים, בלי התרעות שווא',()=>{
  const gate=(o,f)=>{const bad=[];const ot=(o.transactions||[]).length,nt=(f.transactions||[]).length;
    if(o.balance!=null&&f.balance==null)bad.push(1);
    if(ot>=20&&nt<ot*0.2)bad.push(2);
    if((o.loans||[]).length>0&&(f.loans||[]).length===0)bad.push(3);return bad};
  return gate({balance:1},{balance:null}).length===1
    &&gate({transactions:Array(200)},{transactions:Array(10)}).length===1
    &&gate({loans:[{}]},{loans:[]}).length===1
    &&gate({balance:1,transactions:Array(100),loans:[{}]},{balance:2,transactions:Array(90),loans:[{}]}).length===0
    ||'תנאי שגוי'});

// ── 1.49.0: תשתית קיימת בקבצים ──
t('תשתית: dataVersion, מנעול, שגיאות worker, גיבוי',()=>{
  return /const DATA_VERSION=/.test(bg)&&(bg.match(/accountsMutex\(async\(\)=>\{/g)||[]).length>=10
    &&/unhandledrejection/.test(bg)&&/markSyncInFlight/.test(bg)||'חסר רכיב'});

// -- 1.67.0: סינון חובה/זכות וסיכום בתחתית החיפוש --
// ⚠ בדיקה מבנית בלבד (כמו "תשתית" למעלה) — הזרימה החיה של הלשונית לא נבדקת כאן.
t('חיפוש: בורר חובה/זכות קיים ומחובר',()=>{
  const doc=new DOMParser().parseFromString(dashHtml,'text/html');
  const opts=[...doc.querySelectorAll('#movementSearchKind option')].map(o=>o.value).join(',');
  return opts==='both,debit,credit'
    &&/flowPick=String\(\$\('#movementSearchKind'\)\?\.value\|\|'both'\)/.test(dash)
    &&/flowPick==='both'\|\|r\.flow===flowPick/.test(dash)
    &&/kindPick\.value='both'/.test(dash)
    ||'הבורר או החיווט חסרים — opts='+opts});

// ⚠ נולד מכך שהסיכום חושב אחרי slice(0,500) והציג סכום קטן מהאמת.
t('חיפוש: הסיכום נמדד על כל ההתאמות ולא על 500 המוצגות',()=>{
  return /const matched=rows\.filter\(/.test(dash)
    &&/filtered=matched\.slice\(0,500\)/.test(dash)
    &&/debitSum=debitRows\.reduce/.test(dash)&&/creditSum=creditRows\.reduce/.test(dash)
    &&!/\.slice\(0,500\),sum=/.test(dash)
    &&/movement-search-total/.test(dash)&&/<tfoot>/.test(dash)
    ||'הסיכום עדיין נגזר מהשורות המוצגות'});

// -- 1.68.0: בורר המקורות — הפונקציות האמיתיות מהקובץ, על DOM אמיתי --
// ⚠ לא לוגיקה מקבילה: הגוף נחתך מ-dashboard.js ורץ כפי שהוא.
t('חיפוש: בורר המקורות מקבץ, ממיין, מסמן ומגזם',()=>{
  const cut=(txt,name)=>{const i=txt.indexOf('function '+name+'(');if(i<0)throw new Error('לא נמצאה '+name);
    let d=0;for(let k=txt.indexOf('{',i);k<txt.length;k++){if(txt[k]==='{')d++;else if(txt[k]==='}'&&!--d)return txt.slice(i,k+1)}
    throw new Error('לא נסגרה '+name)};
  const host=document.createElement('div');host.style.display='none';
  host.innerHTML='<details><summary id="movementSourceSummary"></summary><div id="movementSourceList"></div></details>';
  document.body.appendChild(host);
  try{
    const pick=new Set();
    const $$=sel=>document.querySelector(sel);
    const esc2=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')};
    const api=new Function('$','esc','movementSourcePick','movementSourceSig','scheduleMovementSearch',
      cut(dash,'renderMovementSources')+';'+cut(dash,'movementSourceAction')+
      ';return{renderMovementSources,movementSourceAction}')($$,esc2,pick,'',()=>{});
    const rows=[{source:'לאומי · 800-1',type:'bank'},{source:'לאומי · 800-1',type:'bank'},
                {source:'ישראכרט · 1234',type:'card'},{source:'פועלים · 12-345',type:'bank'}];
    api.renderMovementSources(rows);
    const boxes=()=>[...document.querySelectorAll('#movementSourceList input[data-src]')];
    const types=boxes().map(b=>b.dataset.type).join(',');
    if(boxes().length!==3)return 'מספר מקורות '+boxes().length;
    if(types!=='bank,bank,card')return 'סדר שגוי: '+types;
    if(!$$('#movementSourceSummary').textContent.includes('(3)'))return 'סיכום: '+$$('#movementSourceSummary').textContent;
    const leumi=boxes().find(b=>b.dataset.src.startsWith('לאומי'));
    if(!leumi.parentElement.querySelector('.msrc-tag').textContent.includes('2'))return 'שתי שורות לאומי לא קובצו';
    api.movementSourceAction('cards');
    if(pick.size!==1||!pick.has('ישראכרט · 1234'))return 'כרטיסים בלבד: '+[...pick].join(',');
    api.renderMovementSources(rows);
    if(!$$('#movementSourceSummary').textContent.includes('1 מתוך 3'))return 'סיכום חלקי: '+$$('#movementSourceSummary').textContent;
    if(!boxes().find(b=>b.dataset.type==='card').checked)return 'הסימון לא שוחזר לתיבה';
    api.renderMovementSources(rows.filter(r=>r.type==='bank'));
    return pick.size===0||'מקור שנעלם לא נגזם מהבחירה';
  }finally{host.remove()}});

t('חיפוש: הבורר מחובר למסנן ולניקוי',()=>{
  const doc=new DOMParser().parseFromString(dashHtml,'text/html');
  return !!doc.querySelector('#movementSourceList')&&!!doc.querySelector('#movementSourceSummary')
    &&/!movementSourcePick\.size\|\|movementSourcePick\.has\(r\.source\)/.test(dash)
    &&/renderMovementSources\(rows\)/.test(dash)
    &&/kindPick\.value='both';movementSourcePick\.clear\(\)/.test(dash)
    ||'הבורר לא מחובר לחיפוש או ל"נקה"'});

// -- 1.69.0: סימון "חדש" לעסקאות כרטיס — storeCardMonth האמיתי מ-background.js --
// ⚠ הגוף נחתך מהקובץ ורץ כפי שהוא, עם cardTxKey/cardTxCounts האמיתיים
// מ-card-history.js. רק ה-IO מוחלף (IndexedDB ו-chrome.storage).
{
 // ⚠ החיתוך חייב לכלול את 'async' שלפני 'function'. בלעדיו הגוף נחתך
 // כפונקציה רגילה, ה-await שבתוכה נקרא כמזהה, והבדיקה נופלת על תחביר.
 const cut=(txt,name)=>{let i=txt.indexOf('function '+name+'(');if(i<0)throw new Error('לא נמצאה '+name);
   if(txt.slice(i-6,i)==='async ')i-=6;
   let d=0;for(let k=txt.indexOf('{',i);k<txt.length;k++){if(txt[k]==='{')d++;else if(txt[k]==='}'&&!--d)return txt.slice(i,k+1)}
   throw new Error('לא נסגרה '+name)};
 const build=()=>{
   let db=[],store={cardNewMarks:{}};
   const chromeStub={storage:{local:{
     get:async d=>({cardNewMarks:JSON.parse(JSON.stringify(store.cardNewMarks||d.cardNewMarks))}),
     set:async o=>{store=JSON.parse(JSON.stringify({...store,...o}))}}}};
   // 2.1.0: storeCardMonth קורא גם cardHistAll (מוכר בכל חודש), txDayMs ו-NEW_WINDOW_MS (כלל 72 השעות).
   const api=new Function('chrome','cardHistGetMonth','cardHistPut','cardHistDeleteMonths','cardHistPrune','cardHistId','cardTxKey','cardTxCounts','cardHistAll','txDayMs','NEW_WINDOW_MS',
     "let cardRunStamp='',cardRunKnown=null,cardRunSeen=null,cardRunSeq=0;"+cut(bg,'beginCardRun')+';'+cut(bg,'storeCardMonth')+
     ';return{beginCardRun,storeCardMonth}')(
     chromeStub,
     async m=>db.filter(r=>String(r.month)===String(m)),
     async r=>{db=db.filter(x=>x.id!==r.id);db.push(JSON.parse(JSON.stringify(r)))},
     async()=>{},async()=>{},(x,m)=>x+'|'+m,
     new Function(cut(ch,'cardTxKey')+';return cardTxKey')(),
     new Function(cut(ch,'cardTxKey')+';'+cut(ch,'cardTxCounts')+';return cardTxCounts')(),
     async()=>db,
     new Function(cut(bg,'txDayMs')+';return txDayMs')(),
     eval(bg.match(/const NEW_WINDOW_MS=([^;]+);/)[1]));
   return {api,keys:x=>store.cardNewMarks[x]?.keys||[],stamp:x=>store.cardNewMarks[x]?.at||'',
     age:(x,k,ms)=>{store.cardNewMarks[x].firstSeen[k]=new Date(Date.now()-ms).toISOString()}};
 };
 const A={date:'01.08.2026',merchant:'רמי לוי',amount:120,payments:''},
       B={date:'02.08.2026',merchant:'דלק',amount:300,payments:''},
       C={date:'03.08.2026',merchant:'סופר פארם',amount:55,payments:''},
       D={date:'04.08.2026',merchant:'קפה',amount:18,payments:''},
       E={date:'05.08.2026',merchant:'פיצה',amount:60,payments:''},
       F={date:'06.08.2026',merchant:'ספרים',amount:90,payments:''},
       today=(()=>{const d=new Date();return{date:`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()%100).padStart(2,'0')}`,merchant:'היום',amount:7,payments:''}})();
 let bad=[];
 try{
  const h=build();
  h.api.beginCardRun();
  await h.api.storeCardMonth('082026',[{suffix:'1234',transactions:[A,B]}]);
  if(h.keys('1234').length)bad.push('סנכרון ראשון סימן '+h.keys('1234').length+' במקום קו בסיס');

  h.api.beginCardRun();
  await h.api.storeCardMonth('082026',[{suffix:'1234',transactions:[A,B,C]}]);
  if(!(h.keys('1234').length===1&&h.keys('1234')[0].includes('סופר פארם')))bad.push('עסקה חדשה לא סומנה: '+JSON.stringify(h.keys('1234')));

  h.api.beginCardRun();
  await h.api.storeCardMonth('082026',[{suffix:'1234',transactions:[A,A,B,C]}]);
  if(!(h.keys('1234').length===2&&h.keys('1234').some(k=>k.includes('רמי לוי'))))bad.push('כפילות זהה נבלעה: '+JSON.stringify(h.keys('1234')));

  // 2.1.0: סנכרון חוזר בלי חדש **לא** מכבה - "חדש" נשאר 72 שעות מהרגע שנראה לראשונה.
  const before=h.stamp('1234');
  h.api.beginCardRun();
  await h.api.storeCardMonth('082026',[{suffix:'1234',transactions:[A,A,B,C]}]);
  if(h.keys('1234').length!==2||h.stamp('1234')===before)bad.push('סנכרון חוזר כיבה "חדש" בתוך 72 שעות: '+h.keys('1234').length);

  // ואחרי 72 שעות - נופל.
  h.age('1234',[...h.keys('1234')].find(k=>k.includes('סופר פארם')),80*3600*1000);
  h.api.beginCardRun();
  await h.api.storeCardMonth('082026',[{suffix:'1234',transactions:[A,A,B,C]}]);
  if(h.keys('1234').some(k=>k.includes('סופר פארם')))bad.push('"חדש" לא פג אחרי 72 שעות');

  // כלל התאריך: עסקה מהיום נצבעת גם בסנכרון ראשון (קו בסיס).
  const j=build();
  j.api.beginCardRun();
  await j.api.storeCardMonth('092026',[{suffix:'5555',transactions:[A,today]}]);
  if(!(j.keys('5555').length===1&&j.keys('5555')[0].includes('היום')))bad.push('עסקה מהיום לא נצבעה לפי תאריך: '+JSON.stringify(j.keys('5555')));

  const g=build();
  g.api.beginCardRun();
  await g.api.storeCardMonth('072026',[{suffix:'9999',transactions:[A,B]}]);
  await g.api.storeCardMonth('082026',[{suffix:'9999',transactions:[C,D]}]);
  if(g.keys('9999').length)bad.push('ריצה ראשונה על כמה חודשים צבעה '+g.keys('9999').length);

  // 2.1.0: עסקה שכבר נראתה בחודש אחר (דף 09 חוזר על אוגוסט) אינה "חדש"; חדשה באמת - כן, ובשני חודשים באותה ריצה נצבר.
  g.api.beginCardRun();
  await g.api.storeCardMonth('072026',[{suffix:'9999',transactions:[A,B,C,E]}]);
  await g.api.storeCardMonth('082026',[{suffix:'9999',transactions:[C,D,A,F]}]);
  const gk=g.keys('9999');
  if(!(gk.length===2&&gk.some(k=>k.includes('פיצה'))&&gk.some(k=>k.includes('ספרים'))))bad.push('חודש חדש צבע עסקאות שכבר נראו: '+JSON.stringify(gk));
 }catch(e){bad.push('חריגה: '+e.message)}
 t('כרטיסים: סימון "חדש" — storeCardMonth האמיתי, 72 שעות ומוכר בכל חודש',()=>!bad.length||bad.join(' · '));
}

t('כרטיסים: המפתח מוגדר פעם אחת, והתג מחובר בשני הצדדים',()=>{
  return /function cardTxKey\(/.test(ch)&&!/function cardTxKey\(/.test(dash)&&!/function cardTxKey\(/.test(bg)
    &&/newTag\(k,t\)/.test(dash)&&/class="new-tag"/.test(dash)&&/\.new-tag\{/.test(dash)
    &&/cardNewMarks/.test(bg)&&/cardNewMarks/.test(dash)&&/beginCardRun\(\)/.test(bg)
    ||'המפתח שוכפל, או שהתג לא מחובר'});

// -- 1.69.0: פילוח הסיכום לפי חודש/מקור — הפונקציות האמיתיות מ-dashboard.js --
t('חיפוש: פילוח לפי חודש, לפי מקור, ושילוב — על DOM אמיתי',()=>{
  const cut=(txt,name)=>{let i=txt.indexOf('function '+name+'(');if(i<0)throw new Error('לא נמצאה '+name);
    if(txt.slice(i-6,i)==='async ')i-=6;
    let d=0;for(let k=txt.indexOf('{',i);k<txt.length;k++){if(txt[k]==='{')d++;else if(txt[k]==='}'&&!--d)return txt.slice(i,k+1)}
    throw new Error('לא נסגרה '+name)};
  const host=document.createElement('div');host.style.display='none';
  host.innerHTML='<div id="movementBreakdownBox"></div>';document.body.appendChild(host);
  try{
    const $$=sel=>document.querySelector(sel);
    const esc2=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')};

// -- 1.76.0: פילוח לפי מונח חיפוש, כשיש יותר ממונח אחד --
t('חיפוש: פילוח לפי מונח — סדר הקלדה, חפיפה נספרת, ומוצע רק מעל מונח אחד',()=>{
  const cut=(txt,name)=>{let i=txt.indexOf('function '+name+'(');if(i<0)throw new Error('לא נמצאה '+name);
    if(txt.slice(i-6,i)==='async ')i-=6;
    let d=0;for(let k=txt.indexOf('{',i);k<txt.length;k++){if(txt[k]==='{')d++;else if(txt[k]==='}'&&!--d)return txt.slice(i,k+1)}
    throw new Error('לא נסגרה '+name)};
  const host=document.createElement('div');host.style.display='none';
  host.innerHTML='<div id="movementBreakdownBox"></div>';document.body.appendChild(host);
  try{
    const $$=sel=>document.querySelector(sel);
    const esc2=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')};
    const mk=(mode,rows,terms=[])=>new Function('$','esc','money','movementBreakdown','movementLastMatched','movementLastTerms',
      cut(dash,'movementMonthTitle')+';'+cut(dash,'movementMonthKey')+';'+cut(dash,'movementMonthDesc')+';'+cut(dash,'movementGroups')+';'+cut(dash,'paintMovementBreakdown')+
      ';return{paintMovementBreakdown,movementGroups}')($$,esc2,new Function(cut(dash,'money')+';return money')(),mode,rows,terms);
    const R=(hay,src,flow,amt)=>({hay,when:0,source:src,flow,amount:amt});
    // "ארנונה מים" מתאים לשני המונחים - וזו בדיוק החפיפה שצריך לספור פעמיים
    // כל שורה כאן התאימה לפחות למונח אחד - כך נראה matched אמיתי.
    const rows=[R('ארנונה גדרה','לאומי · 1','debit',100),R('תאגיד מים','לאומי · 1','debit',60),
                R('ארנונה מים משולב','ישראכרט · 2','debit',40)];
    const terms=['ארנונה','מים'];
    const g=mk('term',rows,terms).movementGroups(rows,'term',terms);
    if(g.length!==2)return 'קבוצות: '+g.length;
    if(g[0].key!=='ארנונה'||g[1].key!=='מים')return 'לא בסדר ההקלדה: '+g.map(x=>x.key).join(',');
    if(g[0].n!==2||g[0].debit!==140)return 'ארנונה: '+JSON.stringify(g[0]);
    if(g[1].n!==2||g[1].debit!==100)return 'מים: '+JSON.stringify(g[1]);

    mk('term',rows,terms).paintMovementBreakdown();
    if(!$$('#movementBreakdownBox button[data-bd="term"].on'))return 'הכפתור "לפי מונח" לא סומן פעיל';
    const head=[...document.querySelectorAll('#movementBreakdownBox thead th')].map(x=>x.textContent);
    if(head[0]!=='מונח חיפוש')return 'כותרת העמודה: '+head[0];
    // ⚠ 4 שורות מותאמות מול 3 שורות שנמצאו - ההערה חייבת להופיע
    const note=$$('#movementBreakdownBox .movement-search-note');
    if(!note||!note.textContent.includes('נספרת בכל אחד מהם'))return 'הערת החפיפה חסרה';

    // מונח יחיד — הכפתור לא מוצע כלל, והמצב חוזר ל"ללא"
    mk('term',rows,['ארנונה']).paintMovementBreakdown();
    if(document.querySelector('#movementBreakdownBox button[data-bd="term"]'))return '"לפי מונח" הוצע על מונח יחיד';
    return document.querySelectorAll('#movementBreakdownBox tbody tr').length===0||'פילוח צויר למרות מונח יחיד';

t('שיקים: הכפתור הנכון מועדף, והביקורת רושמת את מה שיכריע',()=>{

  if(!/const rowBtns=\[\.\.\.hit\.row\.querySelectorAll\('button,\[role="button"\]'\)\]/.test(lc))
    return 'הכפתורים אינם נאספים כרשימה';
  const pick=(lc.match(/const chosen=rowBtns\.find\([^;]+\)\|\|rowBtns\[0\];/)||[])[0];
  if(!pick)return 'בחירת הכפתור לא נמצאה';
  const label=new Function('el',"return String(el?.label||'')");
  const choose=new Function('rowBtns','btnLabel',pick+'return chosen;');
  const cases=[
    ['אין תווית — הראשון, בדיוק כמו קודם',[{label:''},{label:''}],0],
    ['כפתור "צילום שיק" מנצח את הראשון',[{label:'הצג פרטים'},{label:'צילום שיק'}],1],

  for(const [name,btns,want] of cases){

  }
  // הביקורת רושמת בדיוק את מה שדרוש כדי להכריע בין שני החשודים
  for(const field of ['want:reference','cells:hit.cells','buttons:rowBtns.map','clicked:btnLabel','imgs:0'])

  return /auditRow\.imgs=fresh\.length/.test(lc)||'מספר התמונות לא נרשם'});

t('שיקים: מכסת האבחון מכריחה קצירה חוזרת, ומתאפסת',()=>{
  // ⚠ נולד מדיווח של טל: "לא עובד העתקת אבחון". הכפתור עבד; הקציר פשוט
  // לא רץ, כי `have.has(id)` דילג על כל שיק שמור - וכולם שמורים.
  const line=(bg.match(/if\(have\.has\(id\)\)\{[^}]*\}/)||[])[0];
  if(!line)return 'תנאי הדילוג לא נמצא ב-background.js';
  const decide=new Function('have','id','ctx',
    'let auditForce=ctx.force;const r=(()=>{'+line+'return true})();ctx.force=auditForce;return r;');
  const have=new Set(['a|1','a|2','a|3']);
  const ctx={force:2};
  const kept=['a|1','a|2','a|3','a|4'].filter(id=>decide(have,id,ctx));
  if(kept.join(',')!=='a|1,a|2,a|4')return 'המכסה לא נצרכה נכון: '+kept.join(',');
  if(ctx.force!==0)return 'המכסה לא ירדה לאפס: '+ctx.force;
  // בלי מכסה - התנהגות זהה לקודם בדיוק
  const ctx2={force:0};
  const kept2=['a|1','a|4'].filter(id=>decide(have,id,ctx2));
  if(kept2.join(',')!=='a|4')return 'בלי מכסה ההתנהגות השתנתה: '+kept2.join(',');
  if(!/chequeAuditForce:0/.test(bg))return 'המכסה אינה מתאפסת אחרי הקציר';
  return /let auditForce=Number\(\(await chrome\.storage\.local\.get\(\{chequeAuditForce:0\}\)\)/.test(bg)
    ||'המכסה אינה נקראת מהאחסון'});

t('שיקים: שם נשמר רק כששתי קריאות מסכימות',()=>{
  const cut=(txt,name)=>{let i=txt.indexOf('function '+name+'(');if(i<0)throw new Error('לא נמצאה '+name);
    if(txt.slice(i-6,i)==='async ')i-=6;
    let d=0;for(let k=txt.indexOf('{',i);k<txt.length;k++){if(txt[k]==='{')d++;else if(txt[k]==='}'&&!--d)return txt.slice(i,k+1)}
    throw new Error('לא נסגרה '+name)};
  const agree=new Function((ocr.match(/const chqNorm=[^\n]*\n/)||[''])[0]+cut(ocr,'chequeNamesAgree')+';return chequeNamesAgree')();
  const cases=[
    ['זהות','ועד מקומי מושב יד-נתן','ועד מקומי מושב יד-נתן',true],
    ['אחת ארוכה יותר','ועד מקומי מושב יד-נתן','ועד מקומי מושב יד-נתן תאגיד לא רשום',true],

    ['⚠ המקרה של טל','מופז גל','ועד מקומי מושב יד-נתן',false],

  }

// -- 1.80.0: חותמת = סימן לסוג המוסר, לא עוד מקור לשם --
// ⚠ ידע שטל מסר: רק חברות/מושבים/ועדים חותמים. לאדם פרטי אין חותמת.
{
 const cut=(txt,name)=>{let i=txt.indexOf('function '+name+'(');if(i<0)throw new Error('לא נמצאה '+name);
   if(txt.slice(i-6,i)==='async ')i-=6;
   let d=0;for(let k=txt.indexOf('{',i);k<txt.length;k++){if(txt[k]==='{')d++;else if(txt[k]==='}'&&!--d)return txt.slice(i,k+1)}
   throw new Error('לא נסגרה '+name)};
 let bad=[];
 try{
  // גוף ההכרעה **מהקובץ**, עם ה-IO בלבד מוחלף: החיתוך והבאת התמונה
  // מוחלפים במחרוזות, ו-ask מחזיר תשובה מוכנה לפי השאלה שנשאלה.
  const body=cut(ocr,'chequeReadPayer')
    .replace(/const cropped=await chequeCropTopRight\(front\);/,'const cropped="crop";')
    .replace(/const whole=await \(await fetch\(front\)\)\.blob\(\);/,'const whole="full";')
    .replace(/const ask=async\([^)]*\)=>\{[\s\S]*?\n  \};/,'');
  const src=(ocr.match(/const chqNorm=[^\n]*\n/)||[''])[0];
  const chqNorm=new Function(src+';return chqNorm')();
  const chequeNamesAgree=new Function(src+cut(ocr,'chequeNamesAgree')+';return chequeNamesAgree')();
  const make=new Function('ask','CHQ_ASK','CHQ_STAMP_ASK','chequeNamesAgree','chqNorm',body+';return chequeReadPayer');
  const run=(crop,full,stampAns)=>{
    const ask=async(blob,q)=>q==='STAMP'?stampAns:(blob==='crop'?crop:full);
    return make(ask,'NAME','STAMP',chequeNamesAgree,chqNorm)(null,null);
  };
  const YAD='ועד מקומי מושב יד-נתן';
  const [a,b,c,d,e]=await Promise.all([
    run(YAD,YAD,'אין חותמת'),
    run('מופז גל',YAD,YAD),
    run('מופז גל','דוד לוי','אין חותמת'),
    run(YAD,'שגיאה כלשהי',YAD),
    run('אבי כהן','אבי כהן','אין חותמת')]);
  if(!(a.agree&&a.kind==='private'&&a.name===YAD))bad.push('בלי חותמת, שתי קריאות מסכימות: '+JSON.stringify(a));
  if(!(b.agree&&b.kind==='entity'&&b.name===YAD))bad.push('החותמת לא הכריעה מול "מופז גל": '+JSON.stringify(b));
  if(!(!c.agree&&c.kind==='private'))bad.push('חלוקות בלי חותמת נשמרו בכל זאת: '+JSON.stringify(c));
  if(!(d.agree&&d.kind==='entity'&&d.name===YAD))bad.push('קריאה אחת מאושרת מול חותמת נדחתה: '+JSON.stringify(d));
  if(!(e.agree&&e.kind==='private'&&e.name==='אבי כהן'))bad.push('שיק פרטי תקין נדחה: '+JSON.stringify(e));
 }catch(err){bad.push('חריגה: '+err.message)}
 t('שיקים: החותמת מאשרת ישות, והיעדרה אינו כשל',()=>!bad.length||bad.join(' · '));
}

  // ⚠ ההגירה הוסרה ב-1.90.0 אחרי שהתגלתה כמוקש דרוך; הבדיקה שלה הפוכה עכשיו.

t('שיקים: תור האישור מתנהג נכון',()=>{

t('בחירה: כל משתנה שנטען מהאחסון גם מוצהר',()=>{
  // ⚠⚠ השורש של שלושה סבבי "אין בורר": `chooserFocus` נכתב לתוך
  // pendingDiscovered ו-splitDiscovered, **אבל ההצהרה שלו אבדה** בסקריפט
  // עריכה שנכשל באמצע. renderSelection זרקה ReferenceError, והמסך נשאר
  // ריק בלי שום רמז — בזמן שהסטטוס אמר "נמצא 3 חשבון".
  // ⚠ סורק את **כל** שורות ההצהרה ברמה העליונה, לא רק את הראשונה:
  // loanKinds מוצהר ב-var בשורה אחרת, ובדיקה צרה מדי מאשימה לשווא.
  const declared=new Set();
  // אין בקסלאשים כאן בכוונה: כל ניסיון קודם לכתוב מחלקת תווים עם תו
  // שורה נשבר בכתיבה לקובץ.
  // הדגל m מספיק, כי הנקודה ממילא אינה חוצה שורות.
  for(const m of dash.matchAll(/^(?:let|var|const) (.*?);$/gm))
    for(const part of m[1].split(',')){
      const id=part.split('=')[0];
      declared.add((id.includes('*/')?id.split('*/').pop():id).trim());
    }
  if(declared.size<10)return 'לא נמצאו הצהרות ברמה העליונה';
  // כל `foo=data.foo` ב-load() מחייב הצהרה מקבילה
  const missing=[];
  for(const m of dash.matchAll(/(\w+)=data\.\1\s*\|\|/g))
    if(!declared.has(m[1]))missing.push(m[1]);
  if(missing.length)return 'נטענים מהאחסון בלי הצהרה: '+[...new Set(missing)].join(', ');
  // ובפרט המשתנה שהפיל את הבורר
  for(const v of ['chooserFocus','chequePayerSource','chequeLedger','chequeAccounts'])
    if(!declared.has(v))return 'חסרה הצהרה: '+v;
  return true});

   const bank={id:'discount-private-011-1',cards:[{suffix:'9238',issuer:'ישראכרט',amount:1}]}; // הבנק מדווח על אחד - הוא גובר
   const merged=keepAssignedCards(prev,bank).cards;
   if(merged.length!==2||merged[0].amount!==1||merged[1].suffix!=='9012')return 'מיזוג שגוי: '+JSON.stringify(merged);
   const other=keepAssignedCards(prev,{id:'leumi-921-1'});
   return !other.cards||'חשבון אחר קיבל כרטיסים זרים'});
 t('שיוך: מסלול 4 סובל את השבת (11 במקום 10), ומסלול 5 עובר על כמה גששים',()=>{

   const leumi={id:'l',accountNumber:'348300',transactions:[{date:'10.08.2026',action:'ל.מאסטרקרד',details:'',debit:19.9}]};
   const jan=accountForCard([disc,leumi],{suffix:'4719',chargeDate:'10.2',previousChargeMonth:'01.2026',previousCharge:1900.77});
   if(jan?.id!=='d')return 'חיוב שנחת ב-11 (שבת) לא זוהה';
   // הגששים: החדש (09) עוד לא בבנק, הישן (08) כן.
   const hist=[{suffix:'9238',issuer:'ישראכרט',month:'092026',amount:5},{suffix:'9238',issuer:'ישראכרט',month:'082026',amount:3150.3},{suffix:'9238',issuer:'ישראכרט',month:'072026',amount:2585.28},{suffix:'1111',issuer:'ישראכרט',month:'072026',amount:2585.28}];
   const probes=chargeProbesFromHistory(hist,'9238',/ישראכרט/i,'ישראכרט','092026');
   if(probes.map(p=>p.monthKey).join()!=='09.2026,08.2026')return 'סדר/סינון גששים: '+JSON.stringify(probes);
   const card={suffix:'9238',chargeDate:'10.9',previousChargeMonth:'09.2026',previousCharge:3150.3,bankChargeProbes:probes};
   const hit=accountForCard([disc,leumi],card);
   if(hit?.id!=='d')return 'הגשש השני לא ניסה: '+JSON.stringify(hit);
   // שני חשבונות עם אותו חיוב - לא יודעים.
   const twin={...disc,id:'d2'};
   return accountForCard([disc,twin],card)===null||'שיוך לא חד-ערכי התקבל'});
 t('ישראכרט: "החיוב הקודם" הוא זה שכבר נחת - חודש קודם לפני יום החיוב',()=>{
   const run=bg.slice(bg.indexOf('async function runIsracard'),bg.indexOf('const CAL_HOME='));
   if(/prevStoredRows/.test(run))return 'עדיין קורא את החודש הקודם ללא קשר ליום החיוב';
   if(!/if\(new Date\(\)\.getDate\(\)<chargeDay\)landed\.setMonth\(landed\.getMonth\(\)-1\)/.test(run))return 'אין הכרעה לפי יום החיוב';
   if(!/previousChargeMonth:chargePageKey/.test(run))return 'previousChargeMonth אינו חודש הנחיתה';
   return /for\(const m of new Set\(freshPrev\.map\(c=>c\.month\)\)\)/.test(run)||'freshPrev נשמר לחודש אחד בלבד'});
 t('שיוך: כרטיס יתום (דווח ע"י המנפיק, לא בשום חשבון) חוזר לתור השיוך; מוסתר לא חוזר',()=>{
   const start=bg.indexOf('async function reconcileUnassignedCards'),rec=bg.slice(start,bg.indexOf('chrome.storage.onChanged.addListener',start));
   return /LAST=\{isracardUnassigned:'isracardLastCards',calUnassigned:'calLastCards',maxUnassigned:'maxLastCards'\}/.test(rec)
     &&/hiddenCards/.test(rec)&&/isHidden\(s\)\|\|inAccount\(s\)/.test(rec)&&/bankChargeProbes=probes/.test(rec)
     ||'הטיפול ביתומים או בגששים המרובים חסר'});
 t('דשבורד: כרטיס משויך מציג "מחויב מחשבון <בנק> <סניף-חשבון>"',()=>

// ── סיכום ──
const ul=document.getElementById('out');
let pass=0;
for(const r of results){
  const li=document.createElement('li');
  li.className=r.ok?'ok':'fail';
  li.textContent=(r.ok?'✓ ':'✗ ')+r.name+(r.info?' — '+r.info:'');
  ul.appendChild(li);if(r.ok)pass++;
}
document.getElementById('sum').textContent=
  pass===results.length?`✓ כל ${results.length} הבדיקות עברו`:`✗ ${results.length-pass} מתוך ${results.length} נכשלו`;
document.getElementById('sum').className=pass===results.length?'ok':'fail';
})();
